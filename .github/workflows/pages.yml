name: Deploy web demo to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['www/**', 'test/browser.test.js', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: www
      - id: deployment
        uses: actions/deploy-pages@v5

  live-test:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Headless Chrome phone-size play test on the live site
        run: |
          npm i --no-save --no-package-lock puppeteer-core@24
          sleep 20
          PUPPETEER=puppeteer-core CHROME=$(which google-chrome || which chrome) node test/browser.test.js https://offerpk.github.io/nonogram/ /tmp
